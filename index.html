<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>You are an idiot! (dot cc)</title>
    
    <meta name="author" content="TheGeekPizza">
    <meta name="keywords" content="TheGeekPizza">
    <meta name="description" content="This is the orgional and the best flash video on the 'net. Once found on www.youdontknowwhoiam.org, not found where it belong, right here on ...vThis is the orgional and the best flash video on the 'net. Once found on www.youdontknowwhoiam.org, not found where it belong, right here on ...v">

    <link rel="icon" type="image/png" href="pizza.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            z-index: 150;
        }

        .speaker-img {	
            width: 40px;
            height: 40px;
            object-fit: contain;
            cursor: default;
            opacity: 0.4;
        }

        .custom-link {
            font-family: "Times New Roman", Times, serif;
            font-size: 22px;
            text-decoration: underline;
            cursor: default;
        }

        .custom-link, .custom-link:link, .custom-link:visited, .custom-link:active {
            color: #0000ff !important;
        }

        .idiot-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .idiot-container img {
            height: 100vh;
            width: auto;
            max-width: 100vw;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <img class="speaker-img" id="youare-micon" src="roto.webp" alt="Mute Control" draggable="false" onclick="toggleMute(event)">
        <a href="https://youtu.be/kgs2WTlkp5g?si=-RbPzkKAcLxbL3NT" class="custom-link" onclick="event.stopPropagation();">about</a>
        <a href="https://thegeekpizza.github.io/idiot/fl/" class="custom-link" onclick="event.stopPropagation();">flash</a>
    </div>

    <div class="idiot-container">
        <audio id="audio-idiot" src="you-are-an-idiot.mp3" loop></audio>
        <img src="idiot.gif" alt="You Are An Idiot" draggable="false" oncontextmenu="return false;">
    </div>

    <script>
        const audio = document.getElementById('audio-idiot');
        const micon = document.getElementById('youare-micon');
        
        let interactuado = false;

        // Escucha el primer clic en cualquier parte de la pantalla para otorgar permisos explícitos
        document.addEventListener('click', musicPlay);

        function musicPlay() {
            if (!interactuado) {
                interactuado = true;
                
                // 1. Activa el audio en bucle
                audio.play().then(() => { micon.style.opacity = "1"; }).catch(err => console.log(err));
                
                // 2. DISPARO INMEDIATO: Lanza las 6 ventanas emergentes síncronamente con el permiso otorgado
                proCreate();
                
                document.removeEventListener('click', musicPlay);
            }
        }

        function toggleMute(event) {
            event.stopPropagation();
            
            if (!interactuado) {
                interactuado = true;
                audio.play().then(() => { micon.style.opacity = "1"; }).catch(err => console.log(err));
                proCreate();
                document.removeEventListener('click', musicPlay);
                return;
            }

            if (audio.paused) {
                audio.play().catch(e => console.log(e));
                micon.style.opacity = "1"; 
            } else {
                audio.pause();
                audio.currentTime = 0; 
                micon.style.opacity = "0.4"; 
            }
        }

        function openWindow(url) {
            var aWindow = window.open(url, "_blank", 'menubar=no, status=no, toolbar=no, resizable=no, width=357, height=330, titlebar=no, alwaysRaised=yes');
            if (aWindow) {
                try {
                    aWindow.blur();
                    window.focus();
                } catch(e) {}
                setTimeout(() => {
                    try { aWindow.opener = null; } catch(e) {}
                }, 150);
            }
        }

        // Abre exactamente 6 ventanas seguidas de golpe
        function proCreate() {	
            for (var i = 0; i < 6; i++) {
                openWindow('lol.html');
            }
        }

        document.body.addEventListener('click', function() {
            if (interactuado && !audio.paused) {
                openWindow('lol.html');
            }
        });

        window.addEventListener('mousemove', function(e) {
            if (interactuado && !audio.paused) {
                var anchoPantalla = window.innerWidth;
                if (e.clientY < 50 && e.clientX > (anchoPantalla * 0.66)) {
                    proCreate(); 
                }
            }
        });

        window.onmouseout = function () {
            if (interactuado && !audio.paused) {
                proCreate();
            }
            return null;
        };

        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = 'Are you an idiot?';
        });

        document.addEventListener('contextmenu', event => event.preventDefault());
        
        document.addEventListener('keydown', function(e) {
            var keyCode = e.keyCode || e.which;
            if (
                e.key === 'F12' || keyCode == 123 || 
                (e.altKey && (e.key === 'F4' || keyCode == 115)) || 
                (e.ctrlKey && (e.key === 's' || e.key === 'S' || keyCode == 83)) || 
                (e.ctrlKey && (e.key === 'u' || e.key === 'U' || keyCode == 85)) || 
                (e.ctrlKey && e.shiftKey && (e.key === 'Escape' || keyCode == 27)) || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || keyCode == 73 || keyCode == 74 || keyCode == 67))
            ) {
                e.preventDefault();
                alert("You are an idiot!");
                if (interactuado && !audio.paused) {
                    proCreate(); 
                }
                return false;
            }
        });
    </script>
</body>
</html>
