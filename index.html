	<meta charset="utf-8">

	<!-- Favicon apuntando a pizza.png -->
	<link rel="icon" type="image/png" href="pizza.png">
	<style>
		body {
			margin-left: 0;
			background-color: #ffffff;
			overflow: hidden;
		}
				
		.control-panel {
			position: fixed;
			top: 20px;
			left: 20px;
			display: inline-flex;
			align-items: center;
			gap: 12px;
			z-index: 150;
		}

		.speaker-img {	
			width: 40px;
			height: 40px;
			object-fit: contain;
			cursor: default;
			opacity: 0.4;
		}

		.custom-link {
			font-family: "Times New Roman", Times, serif;
			font-size: 22px;
			text-decoration: underline;
			cursor: default;
		}

		.custom-link, .custom-link:link, .custom-link:visited, .custom-link:active {
			color: #0000ff !important;
		}

		.idiot-container {
			position: absolute;
			top: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
			z-index: 50;
		}

		.idiot-container img {
			z-index: -100;
			height: 100%;
			width: auto;
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}
	</style>
</head>
<body>

	<div class="control-panel">
		<img class="speaker-img" id="youare-micon" src="roto.webp" alt="Mute Control" draggable="false" onclick="toggleMute(event)">
		<a href="https://youtu.be/kgs2WTlkp5g?si=OFIPN4H4WgGCHRUw" class="custom-link" onclick="event.stopPropagation();">about</a>
		<a href="https://capybara930s.github.io/idiot-flash/" class="custom-link" onclick="event.stopPropagation();">flash</a>
	</div>

	<div class="idiot-container">
		<audio id="youare-audio" src="you-are-an-idiot.mp3" loop></audio>
		<img src="idiot.gif" alt="You Are An Idiot" draggable="false" oncontextmenu="return false;">
	</div>

	<script>
		var audio = document.getElementById('youare-audio');
		var micon = document.getElementById('youare-micon');
		var primeraInteraccion = false;

		document.addEventListener('click', musicPlay);

		function musicPlay() {
			if (!primeraInteraccion) {
				primeraInteraccion = true;
				if (audio.paused) {
					audio.play()
						.then(function() { 
							micon.style.opacity = "1"; 
							proCreate(); 
						})
						.catch(function(e) { console.log(e); });
				}
				document.removeEventListener('click', musicPlay);
			}
		}

		function toggleMute(event) {
			event.stopPropagation();
			
			if (!primeraInteraccion) {
				primeraInteraccion = true;
				audio.play()
					.then(function() { 
						micon.style.opacity = "1"; 
						proCreate();
					})
					.catch(function(e) { console.log(e); });
				document.removeEventListener('click', musicPlay);
				return;
			}

			if (audio.paused) {
				audio.play().catch(function(e) { console.log(e); });
				micon.style.opacity = "1"; 
			} else {
				audio.pause();
				audio.currentTime = 0; 
				micon.style.opacity = "0.4"; 
			}
		}

		function openWindow(url) {
			var aWindow = window.open(url, "_blank", 'menubar=no, status=no, toolbar=no, resizable=no, width=357, height=330, titlebar=no, alwaysRaised=yes');
			if (aWindow) {
				setTimeout(function() {
					try { aWindow.opener = null; } catch(e) {}
				}, 1500); 
			}
		}

		function proCreate() {	
			for (var i = 0; i < 6; i++) {
				openWindow('lol.html');
			}
		}

		document.body.addEventListener('click', function() {
			if (primeraInteraccion && !audio.paused) {
				openWindow('lol.html');
			}
		});

		window.addEventListener('mousemove', function(e) {
			if (primeraInteraccion && !audio.paused) {
				var anchoPantalla = window.innerWidth;
				if (e.clientY < 50 && e.clientX > (anchoPantalla * 0.66)) {
					proCreate(); 
				}
			}
		});

		window.onmouseout = function () {
			if (primeraInteraccion && !audio.paused) {
				proCreate();
			}
			return null;
		};

		window.oncontextmenu = function() {
			return false;
		}

		// RESTAURADO: Advertencia nativa antes de salir o cerrar la ventana madre
		window.addEventListener('beforeunload', function (e) {
			e.preventDefault();
			e.returnValue = 'Are you an idiot?';
		});

		document.addEventListener('keydown', function(e) {
			var keyCode = e.keyCode || e.which;
			if (
				e.key === 'F12' || keyCode == 123 || 
				(e.altKey && (e.key === 'F4' || keyCode == 115)) || 
				(e.ctrlKey && (e.key === 's' || e.key === 'S' || keyCode == 83)) || 
				(e.ctrlKey && (e.key === 'u' || e.key === 'U' || keyCode == 85)) || 
				(e.ctrlKey && e.shiftKey && (e.key === 'Escape' || keyCode == 27)) || 
				(e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || keyCode == 73 || keyCode == 74 || keyCode == 67))
			) {
				e.preventDefault();
				alert("You are an idiot!"); 
				if (primeraInteraccion && !audio.paused) {
					proCreate();
				}
				return false;
			}
		});
	</script>
</body>
